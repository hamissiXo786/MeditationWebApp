# Checks the app, then deploys the web build (simulated vitals) to:
#   - GitHub Pages:  https://hamissixo786.github.io/MeditationWebApp/
#     One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
#   - EAS Hosting:   https://<project>.expo.app
#     One-time setup: add the repository secret EXPO_TOKEN and variable EAS_PROJECT_ID
#     (Settings -> Secrets and variables -> Actions). Skipped until both exist.
name: Deploy web

on:
  push:
    branches: [main, claude/sweet-brown-wajvgv]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx jest --ci

  pages:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export web build under the repository subpath
        run: npx expo export --platform web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: Single-page app fallback and no Jekyll processing
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  eas-hosting:
    needs: check
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - name: Check EAS credentials
        id: creds
        run: |
          if [ -n "$EXPO_TOKEN" ] && [ -n "$EAS_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::EAS Hosting skipped: add the EXPO_TOKEN secret and EAS_PROJECT_ID variable to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - if: steps.creds.outputs.ready == 'true'
        name: Export web build at the site root
        run: npx expo export --platform web
      - if: steps.creds.outputs.ready == 'true'
        name: Deploy to EAS Hosting (production)
        run: npx eas-cli@latest deploy --prod --non-interactive
